<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campionato dei Broccoli</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: var(--primary); margin: 0; font-size: 2rem; }
    p.subtitle { color: var(--text-muted); margin-top: 4px; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid var(--border); }
    h2 { margin-top: 0; color: var(--text-main); font-size: 1.15rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
    select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; background-color: #fff; }
    button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; font-size: 0.95rem; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
    .match-item { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #fafafa; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
    @media(min-width: 500px) { .match-item { flex-direction: row; justify-content: space-between; align-items: center; } }
    .match-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { padding: 6px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-win { background-color: #dcfce7; color: #166534; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; width: auto; margin: 0; border-radius: 6px; }
    .btn-success { background-color: #10b981; color: white; border: none; }
    .btn-warning { background-color: #f59e0b; color: white; border: none; }
    .btn-danger { background-color: #ef4444; color: white; border: none; }
    .btn-secondary { background-color: #64748b; color: white; border: none; }
    .flex-row { display: flex; gap: 8px; }
    .text-center { text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🥦 Campionato dei Broccoli</h1>
    <p class="subtitle">Cloud Sincronizzato</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>🏆 Classifica Singola</h2>
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Giocatore</th>
            <th>Punti</th>
            <th>V - P</th>
          </tr>
        </thead>
        <tbody id="classifica-body"><tr><td colspan="4" class="text-center">Nessun giocatore inserito.</td></tr></tbody>
      </table>
    </div>

    <div>
      <div class="card">
        <h2>➕ Aggiungi Incontro</h2>
        <div class="form-group">
          <label>Coppia 1</label>
          <div class="flex-row">
            <select id="p1a"></select>
            <select id="p1b"></select>
          </div>
        </div>
        <div class="form-group">
          <label>Coppia 2</label>
          <div class="flex-row">
            <select id="p2a"></select>
            <select id="p2b"></select>
          </div>
        </div>
        <button id="btn-add-match">Registra Partita</button>
      </div>

      <div class="card">
        <h2>👤 Nuovo Giocatore</h2>
        <div class="form-group" style="margin-bottom:0;">
          <input type="text" id="nuovo-giocatore-nome" placeholder="Nome giocatore...">
        </div>
        <button id="btn-add-player" class="btn-secondary">Aggiungi Giocatore</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🎾 Incontri del Torneo</h2>
    <div id="partite-list" class="text-center" style="color:var(--text-muted)">Nessuna partita presente.</div>
  </div>
</div>

<!-- Firebase SDKs e logica pulita -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQyQI3TjlbGozQC5i3BEv_1Pfwa2d1sqc",
    authDomain: "campionato-broccoli.firebaseapp.com",
    projectId: "campionato-broccoli",
    storageBucket: "campionato-broccoli.firebasestorage.app",
    messagingSenderId: "124644639356",
    appId: "1:124644639356:web:d65f69109fef31be5b3ff9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'campionato');

  // Stato iniziale completamente vuoto
  let stato = {
    giocatori: [],
    partite: []
  };

  // Pulisce anche la cache locale per evitare conflitti
  localStorage.removeItem('broccoli_db');

  // Sincronizzazione in tempo reale con Firebase
  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      stato = data;
      if (!stato.giocatori) stato.giocatori = [];
      if (!stato.partite) stato.partite = [];
    }
    aggiornaInterfaccia();
  });

  function aggiornaInterfaccia() {
    popolaSelect();
    calcolaClassifica();
    renderizzaPartite();
  }

  function popolaSelect() {
    ['p1a', 'p1b', 'p2a', 'p2b'].forEach(id => {
      const select = document.getElementById(id);
      const val = select.value;
      select.innerHTML = '';
      if (stato.giocatori && stato.giocatori.length > 0) {
        stato.giocatori.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          select.appendChild(opt);
        });
        if (stato.giocatori.includes(val)) select.value = val;
      } else {
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "Aggiungi prima un giocatore";
        select.appendChild(opt);
      }
    });
  }

  function calcolaClassifica() {
    const tbody = document.getElementById('classifica-body');
    if (!stato.giocatori || stato.giocatori.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="color:var(--text-muted)">Nessun giocatore inserito.</td></tr>';
      return;
    }

    let stats = {};
    stato.giocatori.forEach(g => stats[g] = { punti: 0, vinte: 0, perse: 0 });

    if (stato.partite) {
      stato.partite.forEach(p => {
        if (p && p.vincitore !== 0) {
          const vincenti = (p.vincitore === 1) ? p.c1 : p.c2;
          const perdenti = (p.vincitore === 1) ? p.c2 : p.c1;
          vincenti.forEach(g => { if(stats[g]) { stats[g].punti += 3; stats[g].vinte += 1; } });
          perdenti.forEach(g => { if(stats[g]) { stats[g].perse += 1; } });
        }
      });
    }

    let classifica = stato.giocatori.map(name => ({
      nome: name,
      ...(stats[name] || { punti: 0, vinte: 0, perse: 0 })
    })).sort((a, b) => b.punti - a.punti || b.vinte - a.vinte);

    tbody.innerHTML = '';
    classifica.forEach((item, index) => {
      tbody.innerHTML += `
        <tr>
          <td><b>${index + 1}º</b></td>
          <td><b>${item.nome}</b></td>
          <td><b style="color: var(--primary);">${item.punti}</b></td>
          <td>${item.vinte}V - ${item.perse}P</td>
        </tr>
      `;
    });
  }

  function renderizzaPartite() {
    const container = document.getElementById('partite-list');
    container.innerHTML = '';

    if (!stato.partite || stato.partite.length === 0) {
      container.innerHTML = '<p class="text-center" style="color:var(--text-muted)">Nessuna partita presente.</p>';
      return;
    }

    stato.partite.forEach((p, idx) => {
      let actions = '';
      if (p.vincitore === 0) {
        actions = `
          <button class="btn-sm btn-success" onclick="window.impostaVincitore(${idx}, 1)">Vince C1</button>
          <button class="btn-sm btn-success" onclick="window.impostaVincitore(${idx}, 2)">Vince C2</button>
          <button class="btn-sm btn-danger" onclick="window.eliminaPartita(${idx})">Elimina</button>
        `;
      } else {
        const vincenti = (p.vincitore === 1) ? p.c1.join(' & ') : p.c2.join(' & ');
        actions = `
          <span class="badge badge-win">Vince: ${vincenti}</span>
          <button class="btn-sm btn-warning" onclick="window.impostaVincitore(${idx}, 0)">Annulla</button>
          <button class="btn-sm btn-danger" onclick="window.eliminaPartita(${idx})">Elimina</button>
        `;
      }

      container.innerHTML += `
        <div class="match-item">
          <div><strong>${p.c1.join(' & ')}</strong> vs <strong>${p.c2.join(' & ')}</strong></div>
          <div class="match-actions">${actions}</div>
        </div>
      `;
    });
  }

  window.impostaVincitore = (idx, vincitore) => {
    stato.partite[idx].vincitore = vincitore;
    salvaCloud();
  };

  window.eliminaPartita = (idx) => {
    if (confirm('Vuoi eliminare questa partita?')) {
      stato.partite.splice(idx, 1);
      salvaCloud();
    }
  };

  document.getElementById('btn-add-match').addEventListener('click', () => {
    const p1a = document.getElementById('p1a').value;
    const p1b = document.getElementById('p1b').value;
    const p2a = document.getElementById('p2a').value;
    const p2b = document.getElementById('p2b').value;

    if (!p1a || !p1b || !p2a || !p2b) {
      alert('Seleziona prima i giocatori per le coppie!');
      return;
    }

    if (new Set([p1a, p1b, p2a, p2b]).size !== 4) {
      alert('I 4 giocatori devono essere tutti diversi tra loro!');
      return;
    }

    if (!stato.partite) stato.partite = [];
    stato.partite.push({ c1: [p1a, p1b], c2: [p2a, p2b], vincitore: 0 });
    salvaCloud();
  });

  document.getElementById('btn-add-player').addEventListener('click', () => {
    const input = document.getElementById('nuovo-giocatore-nome');
    const nome = input.value.trim();
    if (nome && !stato.giocatori.includes(nome)) {
      stato.giocatori.push(nome);
      input.value = '';
      salvaCloud();
    } else if (nome) {
      alert('Questo giocatore esiste già!');
    }
  });

  function salvaCloud() {
    set(dbRef, stato);
  }
</script>

</body>
</html>
